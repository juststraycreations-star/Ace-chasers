apply plugin: 'com.android.application'

// ─── Release signing (reads keystore.properties if present) ──────
// Copy `keystore.properties.template` → `keystore.properties`, fill
// in your upload keystore path + passwords locally, and gradle will
// sign automatically. If the file is missing (CI / preview / first
// clone) the debug build still works — only `bundleRelease` needs it.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "net.acechasers.app"
    compileSdkVersion 36 // Android 16 targeting compliance (Play Store 2025+)

    defaultConfig {
        applicationId "net.acechasers.app"
        minSdkVersion 22
        targetSdkVersion 36 // Android 16 targeting compliance
        versionCode 2       // Bumped to bypass the grayed-out console lock
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified
            // to accommodate modern web apps. Do NOT delete unless you
            // understand the consequences.
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Google Services plugin is applied only when google-services.json is
// present, which is how the Capacitor template ships it. Push
// notifications require the file to exist AND have a real 39-char
// api_key — see /app/memory/PUSH_NATIVE_CHECKLIST.md.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
