name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Android SDK Components
        uses: android-actions/setup-android@v3

      - name: Restore Keystore from Secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/acechasers-upload.jks

      - name: Create keystore.properties
        run: |
          cat <<EOF > keystore.properties
          storeFile=acechasers-upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}

      - name: Build and Sign Release Bundle
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Securely Shred Keystore
        if: always()
        run: |
          shred -u app/acechasers-upload.jks || rm -f app/acechasers-upload.jks

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-app-release
          path: app/build/outputs/bundle/release/app-release.aab
